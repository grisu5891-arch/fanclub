@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

.lv-app{
  --bg:#0a1710; --bg2:#0d1d13; --surface:#13271b; --surface2:#183320; --line:#284835;
  --green:#1d6b3f; --green-2:#22824b; --green-bright:#34c172;
  --gold:#c9a24b; --gold-2:#e0bd6e; --gold-soft:#efe0b6;
  --text:#e9f1ea; --muted:#9cb2a3; --muted2:#6f8678; --white:#fff; --black:#05100a;
  --danger:#e05a5a; --danger-bg:#3a1c1c;
  font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color:var(--text);
  background:
    radial-gradient(1200px 500px at 50% -10%, #14301f 0%, transparent 60%),
    linear-gradient(180deg,#0b1a11 0%, #081209 100%);
  min-height:100vh; max-width:720px; margin:0 auto;
  box-shadow:0 0 60px rgba(0,0,0,.4);
}
.lv-app *{ box-sizing:border-box; }
.lv-display{ font-family:'Oswald','Arial Narrow',sans-serif; text-transform:uppercase; letter-spacing:.03em; font-weight:600; }
.lv-app .spin{ animation:lvspin 1s linear infinite; }
@keyframes lvspin{ to{ transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce){ .lv-app .spin{ animation:none; } }
.lv-app button{ cursor:pointer; font-family:inherit; }
.lv-app :focus-visible{ outline:2px solid var(--gold-2); outline-offset:2px; border-radius:6px; }
.lv-hide-sm{ display:inline; }
@media (max-width:420px){ .lv-hide-sm{ display:none; } }

/* Header */
.lv-top{ position:sticky; top:0; z-index:20; }
.lv-header{ background:linear-gradient(180deg,#0f2417,#0b1b11); border-bottom:1px solid var(--line); }
.lv-header-stripe{ height:4px; background:linear-gradient(90deg,var(--black) 0 33%, var(--white) 33% 66%, var(--green) 66% 100%); }
.lv-header-in{ display:flex; align-items:center; gap:14px; padding:12px 16px 8px; }
.lv-logo{ width:54px; height:54px; object-fit:contain; filter:drop-shadow(0 2px 6px rgba(0,0,0,.5)); flex:none; }
.lv-title{ flex:1; min-width:0; }
.lv-title h1{ margin:0; font-size:22px; line-height:1; color:var(--white); letter-spacing:.04em; }
.lv-title p{ margin:3px 0 0; font-size:11px; color:var(--gold-2); letter-spacing:.06em; text-transform:uppercase; }
.lv-refresh{ background:var(--surface2); border:1px solid var(--line); color:var(--gold-2); width:38px; height:38px; border-radius:10px; display:grid; place-items:center; flex:none; }
.lv-refresh:hover{ background:var(--green); color:#fff; }
.lv-status{ display:flex; justify-content:space-between; align-items:center; padding:0 16px 9px; font-size:10.5px; color:var(--muted2); }
.lv-live{ display:inline-flex; align-items:center; gap:4px; color:var(--green-bright); }
.lv-live.off{ color:var(--gold-2); }
.lv-upd{ color:var(--muted2); }

/* Nav */
.lv-nav{ display:flex; background:#0b1b11; border-bottom:1px solid var(--line); }
.lv-nav-btn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 4px; background:none; border:none; color:var(--muted); font-size:11.5px; font-weight:600; border-bottom:2.5px solid transparent; transition:.15s; }
.lv-nav-btn:hover{ color:var(--text); }
.lv-nav-btn.active{ color:var(--gold-2); border-bottom-color:var(--gold); background:linear-gradient(180deg,transparent,rgba(201,162,75,.08)); }

.lv-main{ padding:16px; min-height:50vh; }
.lv-tab{ display:flex; flex-direction:column; gap:14px; }

/* Buttons */
.lv-btn{ display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:10px; border:1px solid var(--line); background:var(--surface2); color:var(--text); font-size:13.5px; font-weight:600; }
.lv-btn.sm{ padding:7px 11px; font-size:12.5px; }
.lv-btn.gold{ background:linear-gradient(180deg,var(--gold-2),var(--gold)); color:#241a06; border-color:var(--gold); }
.lv-btn.gold:hover{ filter:brightness(1.06); }
.lv-btn.ghost{ background:transparent; }
.lv-btn.ghost:hover{ background:var(--surface2); }
.lv-btn.danger{ background:var(--danger); border-color:var(--danger); color:#fff; }
.lv-btn:disabled{ opacity:.45; cursor:not-allowed; }
.lv-icon-btn{ width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--muted); display:grid; place-items:center; }
.lv-icon-btn:hover{ color:var(--text); background:var(--surface2); }
.lv-icon-btn.danger:hover{ color:#fff; background:var(--danger); border-color:var(--danger); }
.lv-icon-btn:disabled{ opacity:.3; cursor:not-allowed; }

/* Stats */
.lv-stats{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.lv-stat{ display:flex; align-items:center; gap:12px; background:linear-gradient(135deg,var(--surface2),var(--surface)); border:1px solid var(--line); border-radius:14px; padding:14px; }
.lv-stat-ic{ width:42px; height:42px; border-radius:11px; background:var(--green); color:#fff; display:grid; place-items:center; flex:none; }
.lv-stat-ic.gold{ background:linear-gradient(180deg,var(--gold-2),var(--gold)); color:#241a06; }
.lv-stat-num{ font-size:28px; line-height:1; color:var(--white); }
.lv-stat-lab{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:3px; }

/* Toolbar / search */
.lv-toolbar{ display:flex; gap:10px; }
.lv-search{ flex:1; display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:0 12px; color:var(--muted); }
.lv-search input{ flex:1; background:none; border:none; color:var(--text); font-size:14px; padding:10px 0; outline:none; }
.lv-search input::placeholder{ color:var(--muted2); }

/* Member cards */
.lv-members{ display:flex; flex-direction:column; gap:10px; }
.lv-mcard{ display:flex; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:13px 14px; }
.lv-mcard-main{ flex:1; min-width:0; }
.lv-mcard-top{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.lv-mname{ font-size:16px; color:var(--white); letter-spacing:.02em; }
.lv-mnick{ font-size:12.5px; color:var(--gold-2); margin-top:2px; }
.lv-mmeta{ display:flex; flex-wrap:wrap; gap:5px 14px; margin-top:7px; font-size:12px; color:var(--muted); }
.lv-mnote{ display:flex; align-items:flex-start; gap:6px; margin-top:8px; font-size:12px; color:var(--muted); background:var(--bg2); border-left:2px solid var(--gold); padding:6px 9px; border-radius:0 7px 7px 0; }
.lv-mcard-actions{ display:flex; gap:7px; align-items:flex-start; }
.lv-confirm{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
.lv-badge{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.04em; }
.lv-badge.gold{ background:linear-gradient(180deg,var(--gold-2),var(--gold)); color:#241a06; }

/* Backup */
.lv-backup{ display:flex; gap:8px; justify-content:center; margin-top:6px; flex-wrap:wrap; padding-top:6px; border-top:1px dashed var(--line); }

/* Empty / hint / loading / error */
.lv-empty{ text-align:center; color:var(--muted); padding:36px 16px; display:flex; flex-direction:column; align-items:center; gap:12px; background:var(--surface); border:1px dashed var(--line); border-radius:14px; }
.lv-empty p{ margin:0; font-size:13.5px; line-height:1.5; }
.lv-loading{ display:flex; align-items:center; gap:10px; justify-content:center; color:var(--muted); padding:28px; font-size:13.5px; }
.lv-error{ display:flex; align-items:center; gap:12px; background:var(--danger-bg); border:1px solid #5a2a2a; color:#f3c9c9; border-radius:12px; padding:13px 15px; }
.lv-error div{ flex:1; } .lv-error b{ color:#fff; font-size:13.5px; } .lv-error p{ margin:3px 0 0; font-size:12px; }
.lv-hint{ display:flex; align-items:center; gap:9px; background:rgba(201,162,75,.1); border:1px solid rgba(201,162,75,.3); color:var(--gold-soft); border-radius:11px; padding:11px 13px; font-size:12.5px; }

/* Season bar */
.lv-season-bar{ display:flex; align-items:center; gap:10px; }
.lv-season-lab{ display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
.lv-season-sel{ background:var(--surface2); border:1px solid var(--line); color:var(--text); border-radius:9px; padding:8px 12px; font-size:13.5px; font-weight:600; font-family:inherit; }

/* Matches */
.lv-matches{ display:flex; flex-direction:column; gap:11px; }
.lv-match{ background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
.lv-match.next{ border-color:var(--gold); box-shadow:0 0 0 1px rgba(201,162,75,.35), 0 6px 22px rgba(0,0,0,.3); }
.lv-next-flag{ display:flex; align-items:center; gap:6px; background:linear-gradient(90deg,var(--gold),var(--gold-2)); color:#241a06; font-size:11px; font-weight:700; padding:5px 13px; text-transform:uppercase; letter-spacing:.04em; }
.lv-match-head{ width:100%; background:none; border:none; color:inherit; text-align:left; padding:12px 14px; display:flex; flex-direction:column; gap:9px; }
.lv-match-meta{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.lv-md{ font-size:11px; color:var(--gold-2); font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
.lv-mdate{ font-size:11.5px; color:var(--muted); }
.lv-match-teams{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; }
.lv-side{ display:flex; align-items:center; gap:9px; min-width:0; }
.lv-side.r{ justify-content:flex-end; }
.lv-side .lv-tn{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lv-side.us .lv-tn{ color:var(--gold-2); font-weight:700; }
.lv-score{ min-width:64px; text-align:center; }
.lv-score b{ font-family:'Oswald',sans-serif; font-size:22px; color:var(--white); letter-spacing:.02em; }
.lv-vs{ font-size:13px; color:var(--muted); font-weight:600; }
.lv-match-foot{ display:flex; align-items:center; gap:11px; flex-wrap:wrap; font-size:11px; color:var(--muted); padding-top:3px; border-top:1px solid var(--line); margin-top:2px; padding-top:9px; }
.lv-ha{ display:inline-flex; align-items:center; gap:4px; font-weight:700; padding:2px 8px; border-radius:20px; }
.lv-ha.home{ background:rgba(52,193,114,.15); color:var(--green-bright); }
.lv-ha.away{ background:rgba(201,162,75,.15); color:var(--gold-2); }
.lv-loc{ display:inline-flex; align-items:center; gap:3px; }
.lv-fin{ color:var(--muted2); }
.lv-expand{ margin-left:auto; display:inline-flex; align-items:center; gap:3px; color:var(--gold-2); font-weight:600; }

/* Crest */
.lv-crest{ border-radius:4px; object-fit:contain; flex:none; background:rgba(255,255,255,.06); padding:1px; }
.lv-crest-fb{ border-radius:5px; background:var(--surface2); border:1px solid var(--line); display:grid; place-items:center; font-weight:700; color:var(--muted); flex:none; font-family:'Oswald',sans-serif; }

/* Attendance */
.lv-att{ border-top:1px solid var(--line); background:var(--bg2); padding:13px 14px; display:flex; flex-direction:column; gap:11px; }
.lv-att-empty{ align-items:flex-start; gap:10px; }
.lv-att-empty p{ margin:0; font-size:12.5px; color:var(--muted); }
.lv-att-head{ display:flex; justify-content:space-between; align-items:center; }
.lv-att-count{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--green-bright); }
.lv-att-bulk{ display:flex; gap:6px; }
.lv-mini{ background:var(--surface2); border:1px solid var(--line); color:var(--muted); border-radius:7px; padding:4px 10px; font-size:11.5px; font-weight:600; }
.lv-mini:hover{ color:var(--text); }
.lv-att-list{ display:flex; flex-direction:column; gap:5px; max-height:320px; overflow:auto; }
.lv-att-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:3px 6px 3px 4px; }
.lv-att-row.on{ border-color:rgba(52,193,114,.5); background:rgba(52,193,114,.07); }
.lv-att-name{ display:flex; align-items:center; gap:9px; background:none; border:none; color:var(--text); padding:7px 6px; flex:1; min-width:0; text-align:left; font-size:13.5px; }
.lv-att-txt{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lv-check{ width:21px; height:21px; border-radius:6px; border:2px solid var(--muted2); display:grid; place-items:center; flex:none; color:#fff; }
.lv-check.on{ background:var(--green-2); border-color:var(--green-2); }
.lv-dk-ic{ color:var(--gold-2); flex:none; }
.lv-paid{ display:inline-flex; align-items:center; gap:5px; background:var(--surface2); border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:6px 10px; font-size:11.5px; font-weight:700; flex:none; }
.lv-paid.on{ background:rgba(52,193,114,.16); border-color:rgba(52,193,114,.5); color:var(--green-bright); }
.lv-att-note{ display:flex; flex-direction:column; gap:6px; }
.lv-att-note span{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted); font-weight:600; }
.lv-att-note textarea{ background:var(--surface); border:1px solid var(--line); color:var(--text); border-radius:9px; padding:9px 11px; font-size:13px; font-family:inherit; resize:vertical; outline:none; }
.lv-att-note textarea:focus{ border-color:var(--gold); }

/* Table */
.lv-sec{ display:flex; align-items:center; gap:8px; font-size:15px; color:var(--white); margin:4px 0 0; }
.lv-table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:13px; background:var(--surface); }
.lv-table{ width:100%; border-collapse:collapse; font-size:13px; min-width:340px; }
.lv-table th{ font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted2); font-weight:700; padding:9px 6px; border-bottom:1px solid var(--line); text-align:left; }
.lv-table td{ padding:8px 6px; border-bottom:1px solid rgba(40,72,53,.5); }
.lv-table tr:last-child td{ border-bottom:none; }
.lv-table .c{ text-align:center; }
.lv-table tr.us{ background:linear-gradient(90deg,rgba(201,162,75,.16),transparent); }
.lv-table tr.us td{ color:var(--white); }
.lv-table tr.us .lv-tteam span{ color:var(--gold-2); font-weight:700; }
.lv-tteam{ display:flex; align-items:center; gap:8px; }
.lv-tteam span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px; }
.lv-rank{ display:inline-grid; place-items:center; width:21px; height:21px; border-radius:6px; font-size:11px; font-weight:700; background:var(--surface2); color:var(--muted); }
.lv-rank.cl{ background:var(--green-2); color:#fff; }
.lv-rank.el{ background:#2a5cc4; color:#fff; }
.lv-rank.co{ background:#1f8a8a; color:#fff; }
.lv-rank.rel{ background:#a23b3b; color:#fff; }
@media (max-width:480px){ .lv-table .wd{ display:none; } }
.lv-legend{ display:flex; flex-wrap:wrap; gap:8px 14px; font-size:10.5px; color:var(--muted); padding:2px 2px 0; }
.lv-legend span{ display:inline-flex; align-items:center; gap:5px; }
.lv-legend .d{ width:9px; height:9px; border-radius:3px; display:inline-block; }
.lv-legend .d.cl{ background:var(--green-2); } .lv-legend .d.el{ background:#2a5cc4; }
.lv-legend .d.co{ background:#1f8a8a; } .lv-legend .d.rel{ background:#a23b3b; }

/* Results */
.lv-results{ margin-top:6px; }
.lv-md-nav{ display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:10px; font-size:15px; color:var(--white); }
.lv-res-list{ display:flex; flex-direction:column; gap:6px; }
.lv-res{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px 12px; }
.lv-res.us{ background:linear-gradient(90deg,rgba(201,162,75,.12),rgba(201,162,75,.04)); border-color:rgba(201,162,75,.35); }
.lv-res-t{ display:flex; align-items:center; gap:7px; min-width:0; font-size:12.5px; }
.lv-res-t.l{ justify-content:flex-end; }
.lv-res-t.r{ justify-content:flex-start; }
.lv-res-t.b .lv-res-name{ color:var(--gold-2); font-weight:700; }
.lv-res-name{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lv-res-mid{ min-width:52px; text-align:center; }
.lv-res-mid b{ font-family:'Oswald',sans-serif; font-size:16px; color:var(--white); }
.lv-res-time{ font-size:12px; color:var(--muted); }

/* Modal */
.lv-modal-bg{ position:fixed; inset:0; background:rgba(4,12,7,.78); backdrop-filter:blur(3px); z-index:50; display:flex; align-items:flex-end; justify-content:center; padding:0; }
@media (min-width:560px){ .lv-modal-bg{ align-items:center; padding:20px; } }
.lv-modal{ background:linear-gradient(180deg,var(--surface2),var(--surface)); border:1px solid var(--line); border-radius:18px 18px 0 0; width:100%; max-width:480px; max-height:92vh; display:flex; flex-direction:column; box-shadow:0 -10px 40px rgba(0,0,0,.5); }
@media (min-width:560px){ .lv-modal{ border-radius:18px; } }
.lv-modal-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--line); }
.lv-modal-head h3{ margin:0; font-size:18px; color:var(--white); }
.lv-modal-body{ padding:16px 18px; overflow-y:auto; display:flex; flex-direction:column; gap:13px; }
.lv-modal-foot{ display:flex; gap:10px; justify-content:flex-end; padding:14px 18px; border-top:1px solid var(--line); }
.lv-row2{ display:grid; grid-template-columns:1fr 1fr; gap:11px; }
.lv-field{ display:flex; flex-direction:column; gap:5px; }
.lv-field span{ font-size:11.5px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
.lv-field input, .lv-field textarea{ background:var(--bg2); border:1px solid var(--line); color:var(--text); border-radius:9px; padding:10px 12px; font-size:14px; font-family:inherit; outline:none; }
.lv-field input:focus, .lv-field textarea:focus{ border-color:var(--gold); }
.lv-field textarea{ resize:vertical; }
.lv-dk-box{ background:var(--bg2); border:1px solid var(--line); border-radius:11px; padding:12px 13px; display:flex; flex-direction:column; gap:10px; }
.lv-dk-top{ display:flex; align-items:center; justify-content:space-between; }
.lv-dk-label{ display:inline-flex; align-items:center; gap:8px; font-size:14px; font-weight:600; color:var(--gold-2); }
.lv-dk-nr{ background:var(--surface); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:9px 11px; font-size:13.5px; font-family:inherit; outline:none; }
.lv-dk-nr:focus{ border-color:var(--gold); }

/* Toggle */
.lv-toggle{ width:46px; height:26px; border-radius:20px; background:var(--surface); border:1px solid var(--line); position:relative; transition:.18s; flex:none; padding:0; }
.lv-toggle-knob{ position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:var(--muted); transition:.18s; }
.lv-toggle.on .lv-toggle-knob{ left:22px; background:#fff; }

/* Footer + toast */
.lv-footer{ text-align:center; padding:16px; font-size:10.5px; color:var(--muted2); border-top:1px solid var(--line); }
.lv-toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--green-2); color:#fff; padding:11px 18px; border-radius:30px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; z-index:60; box-shadow:0 8px 26px rgba(0,0,0,.4); animation:lvtoast .25s ease; }
@keyframes lvtoast{ from{ opacity:0; transform:translate(-50%,10px); } }

/* Beitrags-Badges */
.lv-badge.ok{ background:rgba(52,193,114,.18); color:var(--green-bright); }
.lv-badge.warn{ background:rgba(224,189,110,.16); color:var(--gold-2); }
.lv-badge.mut{ background:var(--surface2); color:var(--muted); }

/* Beitr\xE4ge-Zeile */
.lv-dues-line{ display:flex; flex-wrap:wrap; gap:8px; }
.lv-pill{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:6px 12px; border-radius:20px; border:1px solid var(--line); background:var(--surface); color:var(--muted); }
.lv-pill.ok{ color:var(--green-bright); border-color:rgba(52,193,114,.4); background:rgba(52,193,114,.1); }
.lv-pill.warn{ color:var(--gold-2); border-color:rgba(224,189,110,.4); background:rgba(224,189,110,.1); }
.lv-pill.mut{ color:var(--muted); }

/* Geburtstags-Banner */
.lv-bday-banner{ display:flex; align-items:center; gap:9px; background:rgba(201,162,75,.1); border:1px solid rgba(201,162,75,.3); color:var(--gold-soft); border-radius:11px; padding:10px 13px; font-size:12.5px; }
.lv-bday-banner svg{ flex:none; color:var(--gold-2); }

/* Adresse + Meta-Icons */
.lv-maddr{ display:flex; align-items:flex-start; gap:6px; margin-top:7px; font-size:12px; color:var(--muted); }
.lv-maddr svg{ flex:none; margin-top:1px; }
.lv-mmeta svg{ vertical-align:-2px; }

/* Segmented Control */
.lv-seg{ display:flex; gap:6px; }
.lv-seg-btn{ flex:1; background:var(--surface); border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:9px 6px; font-size:13px; font-weight:600; }
.lv-seg-btn:hover{ color:var(--text); }
.lv-seg-btn.on.ok{ background:var(--green-2); border-color:var(--green-2); color:#fff; }
.lv-seg-btn.on.warn{ background:linear-gradient(180deg,var(--gold-2),var(--gold)); border-color:var(--gold); color:#241a06; }
.lv-seg-btn.on.mut{ background:var(--surface2); border-color:var(--muted2); color:var(--text); }

/* Date-Input dunkel */
.lv-field input[type=date]{ color-scheme:dark; }

/* Statistik */
.lv-stats3{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
.lv-stat.sm{ padding:11px; gap:9px; border-radius:12px; }
.lv-stat.sm .lv-stat-ic{ width:34px; height:34px; border-radius:9px; }
.lv-stat.sm .lv-stat-num{ font-size:21px; }
.lv-stat.sm .lv-stat-lab{ font-size:9.5px; letter-spacing:.03em; }
.lv-stat-ic.warn{ background:linear-gradient(180deg,#e0a86e,#c97a4b); color:#2a1606; }
.lv-rank-list{ display:flex; flex-direction:column; gap:8px; }
.lv-rank-row{ display:flex; gap:11px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:11px 13px; }
.lv-rank-row.top{ border-color:var(--gold); box-shadow:0 0 0 1px rgba(201,162,75,.3); background:linear-gradient(135deg,rgba(201,162,75,.1),var(--surface)); }
.lv-rank-pos{ width:27px; height:27px; border-radius:8px; background:var(--surface2); color:var(--muted); display:grid; place-items:center; font-weight:700; font-family:'Oswald',sans-serif; font-size:14px; flex:none; }
.lv-rank-row.top .lv-rank-pos{ background:linear-gradient(180deg,var(--gold-2),var(--gold)); color:#241a06; }
.lv-rank-body{ flex:1; min-width:0; }
.lv-rank-name{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.lv-rank-name>span:first-child{ font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lv-rank-att{ font-size:18px; color:var(--white); flex:none; }
.lv-rank-att small{ font-size:11px; color:var(--muted); font-weight:400; }
.lv-rank-bar{ height:6px; background:var(--bg2); border-radius:4px; overflow:hidden; margin:7px 0; }
.lv-rank-bar span{ display:block; height:100%; background:linear-gradient(90deg,var(--green-2),var(--green-bright)); border-radius:4px; transition:width .4s ease; }
.lv-rank-row.top .lv-rank-bar span{ background:linear-gradient(90deg,var(--gold),var(--gold-2)); }
.lv-rank-meta{ display:flex; flex-wrap:wrap; gap:5px 13px; font-size:11px; color:var(--muted); }
.lv-rank-meta span{ display:inline-flex; align-items:center; gap:4px; }
.lv-unpaid{ color:var(--gold-2) !important; font-weight:700; }

/* Geburtstagskalender */
.lv-cal-btn{ display:flex; align-items:center; gap:9px; width:100%; background:var(--surface); border:1px solid var(--line); color:var(--text); border-radius:11px; padding:11px 13px; font-size:13.5px; font-weight:600; }
.lv-cal-btn:hover{ background:var(--surface2); border-color:var(--gold); }
.lv-cal-btn>svg:first-child{ color:var(--gold-2); flex:none; }
.lv-cal-count{ background:var(--surface2); color:var(--gold-2); border-radius:20px; padding:2px 9px; font-size:11.5px; font-weight:700; }
.lv-cal-chev{ margin-left:auto; color:var(--muted); }
.lv-bm{ margin-bottom:14px; }
.lv-bm-h{ font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.05em; font-size:12.5px; color:var(--gold-2); border-bottom:1px solid var(--line); padding-bottom:5px; margin-bottom:6px; }
.lv-bm-row{ display:flex; align-items:center; gap:11px; padding:7px 8px; border-radius:8px; }
.lv-bm-row.today{ background:linear-gradient(90deg,rgba(201,162,75,.2),transparent); }
.lv-bm-row.soon{ background:rgba(52,193,114,.07); }
.lv-bm-day{ font-family:'Oswald',sans-serif; font-size:13.5px; color:var(--white); letter-spacing:.02em; flex:none; width:52px; }
.lv-bm-mid{ flex:1; min-width:0; display:flex; flex-direction:column; }
.lv-bm-name{ font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lv-bm-age{ font-size:11px; color:var(--muted); }
.lv-bm-rel{ flex:none; font-size:11px; color:var(--muted); white-space:nowrap; }
.lv-bm-row.today .lv-bm-rel{ color:var(--gold-2); font-weight:700; }

/* Sync / Einstellungen */
.lv-sync-intro{ font-size:12.5px; color:var(--muted); line-height:1.5; margin:0; }
.lv-steps{ margin:0; padding-left:18px; display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--muted); line-height:1.45; }
.lv-steps b{ color:var(--text); }
.lv-sync-row{ display:flex; gap:8px; align-items:center; }
.lv-sync-row input{ flex:1; }
.lv-sync-status{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.lv-sync-state{ font-size:12px; color:var(--muted); }
.lv-sync-state.ok{ color:var(--green-bright); }
.lv-sync-state.error{ color:var(--danger); }
.lv-sync-note{ display:flex; gap:7px; align-items:flex-start; font-size:11.5px; color:var(--muted); background:var(--bg2); border-radius:9px; padding:9px 11px; margin:0; line-height:1.45; }
.lv-sync-note svg{ flex:none; margin-top:1px; color:var(--gold-2); }

/* Passwort-Feld */
.lv-pw-wrap{ position:relative; display:flex; }
.lv-pw-wrap input{ flex:1; padding-right:42px; background:var(--bg2); border:1px solid var(--line); color:var(--text); border-radius:9px; padding-top:10px; padding-bottom:10px; padding-left:12px; font-size:14px; font-family:inherit; outline:none; width:100%; }
.lv-pw-wrap input:focus{ border-color:var(--gold); }
.lv-pw-eye{ position:absolute; right:5px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--muted); width:32px; height:32px; display:grid; place-items:center; border-radius:7px; }
.lv-pw-eye:hover{ color:var(--text); }

/* Sperrbildschirm */
.lv-lock{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:30px 22px; text-align:center; }
.lv-lock-logo{ width:96px; height:96px; object-fit:contain; filter:drop-shadow(0 4px 16px rgba(0,0,0,.55)); margin-bottom:4px; }
.lv-lock h1{ margin:0; font-size:26px; color:var(--white); letter-spacing:.04em; }
.lv-lock-sub{ display:flex; align-items:center; gap:6px; color:var(--gold-2); font-size:12px; margin:2px 0 16px; text-transform:uppercase; letter-spacing:.05em; }
.lv-lock-form{ display:flex; gap:8px; width:100%; max-width:330px; }
.lv-lock-form .lv-pw-wrap{ flex:1; }
.lv-lock-form .lv-pw-wrap input{ font-size:15px; }
.lv-lock-err{ color:var(--danger); font-size:13px; margin:6px 0 0; }

/* Einstellungen */
.lv-set-h{ display:flex; align-items:center; gap:8px; font-size:14.5px; color:var(--white); margin:2px 0 0; font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.03em; }
.lv-set-h svg{ color:var(--gold-2); }
.lv-set-divider{ height:1px; background:var(--line); margin:4px 0; }
.lv-pw-actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.lv-pw-form{ display:flex; flex-direction:column; gap:9px; }
.lv-pw-state{ font-size:11px; font-weight:700; padding:2px 9px; border-radius:20px; margin-left:auto; }
.lv-pw-state.on{ background:rgba(52,193,114,.18); color:var(--green-bright); }
.lv-pw-state.off{ background:var(--surface2); color:var(--muted); }
.lv-join-box{ background:rgba(201,162,75,.1); border:1px solid rgba(201,162,75,.4); border-radius:12px; padding:13px; display:flex; flex-direction:column; gap:9px; }
.lv-join-box .lv-jh{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--gold-soft); }

/* Notizen */
.lv-notes-h{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); font-weight:600; flex:1; }
.lv-notes{ display:flex; flex-direction:column; gap:10px; }
.lv-note{ display:flex; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:13px 14px; }
.lv-note-main{ flex:1; min-width:0; cursor:pointer; }
.lv-note-title{ font-size:15.5px; color:var(--white); letter-spacing:.02em; }
.lv-note-text{ font-size:13px; color:var(--muted); margin-top:5px; line-height:1.5; white-space:pre-wrap; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.lv-note-date{ font-size:11px; color:var(--muted2); margin-top:8px; }
.lv-note-actions{ display:flex; gap:7px; align-items:flex-start; }
.lv-ics{ margin-left:auto; }
.lv-sec-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.lv-sec-row .lv-sec{ margin:0; }
.lv-lock-hint{ color:var(--muted); font-size:12px; margin:10px 0 0; max-width:330px; line-height:1.4; }
